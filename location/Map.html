<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mapping</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 50px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            font-family: Arial;
        }
    </style>
</head>
<body>

<div class="info">
    <b>Distance:</b> <span id="distance">0</span> KM
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    
    var map = L.map('map').setView([26.8467, 80.9462], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
    let userMarker, secondMarker, line;

    navigator.geolocation.watchPosition((position) => {
        let lat = position.coords.latitude;
        let lng = position.coords.longitude;

        map.setView([lat, lng], 15);
        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Your Live Location 📍").openPopup();

    }, (err) => {
        alert("Location access denied!");
    });


    map.on('click', function(e) {
        let lat2 = e.latlng.lat;
        let lng2 = e.latlng.lng;

        if (secondMarker) map.removeLayer(secondMarker);

        secondMarker = L.marker([lat2, lng2]).addTo(map).bindPopup("Second Location 📍").openPopup();
        connectLocations();
    });

    function connectLocations() 
    {
        if (!userMarker || !secondMarker) return;

        let latlng1 = userMarker.getLatLng();
        let latlng2 = secondMarker.getLatLng();
        if (line) map.removeLayer(line);

        line = L.polyline([latlng1, latlng2], {color: 'blue'}).addTo(map);
        calculateDistance(latlng1, latlng2);
    }

    function calculateDistance(p1, p2) {
        let distance = map.distance(p1, p2) / 1000; 
        distance = distance.toFixed(2);

        document.getElementById("distance").innerText = distance;
        speakDistance(distance);
    }

    function speakDistance(distance) 
    {
        let msg = new SpeechSynthesisUtterance(
            "Distance is " + distance + " kilometers"
        );

        speechSynthesis.speak(msg);
    }

</script>

</body>
</html>
